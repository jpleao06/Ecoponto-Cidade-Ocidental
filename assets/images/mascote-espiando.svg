<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" fill="none" class="w-full h-auto">
  <style>
    @keyframes peekBob {
      0%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-8px);
      }
      65% {
        transform: translateY(-6px);
      }
    }
    .espiando-corpo {
      animation: peekBob 2.6s ease-in-out infinite;
    }
    @keyframes lookAround {
      0%, 25%, 100% {
        transform: translate(0, 0);
      }
      35%, 60% {
        transform: translate(-3.5px, -1px);
      }
      72%, 92% {
        transform: translate(3.5px, -1px);
      }
    }
    .pupilas {
      animation: lookAround 3.8s ease-in-out infinite;
    }
    @keyframes handsWiggle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .maozinhas {
      animation: handsWiggle 1.9s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .espiando-corpo, .pupilas, .maozinhas {
        animation: none !important;
      }
    }
  </style>

  <!-- Mascote espiando por cima de um muro/borda -->
  <g class="espiando-corpo">
    <!-- Tampa Azul inclinada curiosa -->
    <rect x="24" y="16" width="92" height="18" rx="6" fill="#1D4ED8" stroke="#171717" stroke-width="4.5" transform="rotate(-4 70 25)" />
    <path d="M 60 14 C 60 4 80 4 80 14" stroke="#171717" stroke-width="4.5" fill="#EAB308" transform="rotate(-4 70 25)" />

    <!-- Cabeça / Topo do Corpo Verde -->
    <path d="M 30 110 L 30 42 C 30 35 36 30 44 30 L 96 30 C 104 30 110 35 110 42 L 110 110 Z" fill="#15803D" stroke="#171717" stroke-width="5" />

    <!-- Olhos grandes espiando para baixo/frente -->
    <ellipse cx="56" cy="58" rx="10" ry="12" fill="#FFFFFF" stroke="#171717" stroke-width="4" />
    <ellipse cx="88" cy="58" rx="10" ry="12" fill="#FFFFFF" stroke="#171717" stroke-width="4" />

    <!-- Pupilas animadas olhando curiosas -->
    <g class="pupilas">
      <circle cx="58" cy="62" r="6" fill="#171717" />
      <circle cx="60" cy="58" r="2.2" fill="#FFFFFF" />

      <circle cx="90" cy="62" r="6" fill="#171717" />
      <circle cx="92" cy="58" r="2.2" fill="#FFFFFF" />
    </g>

    <!-- Bochechas simpáticas -->
    <ellipse cx="44" cy="74" rx="5" ry="3" fill="#EAB308" opacity="0.8" />
    <ellipse cx="100" cy="74" rx="5" ry="3" fill="#EAB308" opacity="0.8" />

    <!-- Sorrisinho feliz -->
    <path d="M 64 78 C 70 86 76 86 82 78" stroke="#171717" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Mãozinhas apoiadas na borda inferior mexendo suavemente -->
  <g class="maozinhas">
    <path d="M 28 102 C 28 94 36 94 40 98 C 42 94 50 94 52 100 L 52 110 L 28 110 Z" fill="#DC2626" stroke="#171717" stroke-width="3.5" />
    <path d="M 88 100 C 90 94 98 94 100 98 C 104 94 112 94 112 102 L 112 110 L 88 110 Z" fill="#DC2626" stroke="#171717" stroke-width="3.5" />
  </g>
</svg>
